<!DOCTYPE html>

<head>

    <title>Revisão HTML e CSS</title>
</head>
<body>
    <p>Esse é um parágrafo</p>

    <h1>Título T1</h1>
    <h6>Título T6</h6>

    <ol>
        <li>Posição 1 - P1</li>
        <li>P2</li>
        <li>P3</li>
    </ol>

    <ul>
        <li>Item 1 - I1</li>
        <li>I2</li>
        <li>I3</li>
    </ul>

    <nav>
        <ul>
            <li>Item</li>
        </ul>
    </nav>

    <main>
        <p>Texto</p>
    </main>

    <div>
        <p>Texto</p>
        <p>Texto + <spam>Texto</spam></p>
    </div>

</html>
