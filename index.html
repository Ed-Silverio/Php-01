<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão HTML e CSS</title>
</head>
<body>
    <p>Esse é um parágrafo</p>

    <h1>Título T1</h1>
    <h6>Título T6</h6>

    <ol>
        <li>Posição 1 - P1</li>
        <li>P2</li>
        <li>P3</li>
    </ol>

    <ul>
        <li>Item 1 - I1</li>
        <li>I2</li>
        <li>I3</li>
    </ul>

    <a href="https://google.com.br">Clique aqui</a>

    <img src="imagem.png" alt="Foto de Perfil" />

    <nav>
        <ul>
            <li>Item</li>
        </ul>
    </nav>

    <main>
        <p>Texto</p>
    </main>

    <div>
        <p>Texto</p>
        <p>Texto + <spam>Texto</spam></p>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Coluna 1</th>
                <th>Coluna 2</th>
                <th>Coluna 3</th>
                <th>Coluna 4</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Dado 1</td>
                <td>Dado 2</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Rodapé</td>
            </tr>
        </tfoot>
    </table>
    <form action="" method="">
        <label for="nome">Informe o nome:</label>
        <input type="text" id="nome" name="nome>">

        <label for="desc">Descrição:</label>
        <textarea id="desc" name="desc"></textarea>

        <label for="opt" name="opt">Opção:</label>
        <select id="opt" name="opt">
            <option value="1">Valor 1</option>
            <option value="2">Valor 2</option>
        </select>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
